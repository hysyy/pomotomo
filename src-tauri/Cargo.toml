[package]
name = "pomotomo"
version = "0.1.0"
description = "A lightweight Pomodoro timer"
authors = ["HySy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
